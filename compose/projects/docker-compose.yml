# NAS projects stack: RabbitMQ + local Docker Registry + TellegramService
# Shares the external "nas" network created by the core stack.
# Host ports bind to TAILSCALE_IP only (not LAN / 0.0.0.0).

services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    hostname: nas
    restart: unless-stopped
    environment:
      RABBITMQ_NODENAME: rabbit@nas
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    volumes:
      - ${NAS_ROOT}/docker/rabbitmq:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    ports:
      - "${TAILSCALE_IP}:${RABBITMQ_PORT:-5672}:5672"
      - "${TAILSCALE_IP}:${RABBITMQ_MGMT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nas

  registry:
    image: registry:2
    container_name: registry
    restart: unless-stopped
    volumes:
      - ${NAS_ROOT}/docker/registry:/var/lib/registry
      - ./registry-config.yml:/etc/docker/registry/config.yml:ro
      - ${NAS_ROOT}/docker/registry-auth:/auth:ro
    ports:
      - "${TAILSCALE_IP}:${REGISTRY_PORT:-5000}:5000"
    mem_limit: 256m
    networks:
      - nas

  # Image must be pushed first from Mac (crane/docker) to this registry.
  # Pulls happen on the Docker *host*, so use Tailscale IP — not the
  # compose service name "registry" (that only resolves inside the nas network).
  tellegram:
    image: ${TAILSCALE_IP}:${REGISTRY_PORT:-5000}/tellegramservice:latest
    container_name: tellegram
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__UserName: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASS}
      RabbitMq__Exchange: alerts
      RabbitMq__Queue: telegram.alerts
      RabbitMq__RoutingKey: "alert.#"
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN}
      Telegram__ChatId: ${TELEGRAM_CHAT_ID}
      Telegram__ParseMode: HTML
    networks:
      - nas

  # AI Trading Advisor — build/push ai-trading:latest to the local registry first.
  # Dashboard: http://${TAILSCALE_IP}:5000  (Tailscale only)
  # Place config.yaml under ${NAS_ROOT}/docker/ai-trading/config.yaml
  ai-trading:
    image: ${TAILSCALE_IP}:${REGISTRY_PORT:-5000}/ai-trading:latest
    platform: linux/amd64
    container_name: ai-trading
    restart: unless-stopped
    working_dir: /app
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      HOST: "0.0.0.0"
      PORT: "5000"
      TZ: ${TZ:-Asia/Kolkata}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ALERTS_RABBITMQ_HOST: rabbitmq
      ALERTS_RABBITMQ_USER: ${RABBITMQ_USER}
      ALERTS_RABBITMQ_PASS: ${RABBITMQ_PASS}
      ALERTS_RABBITMQ_PORT: "5672"
      ALERTS_DASHBOARD_BASE_URL: http://${TAILSCALE_IP}:${AI_TRADING_PORT:-5100}
      REPORT_AUTO_OPEN: "false"
    volumes:
      - ${NAS_ROOT}/docker/ai-trading/config.yaml:/app/config.yaml
      - ${NAS_ROOT}/docker/ai-trading/data:/app/data
    ports:
      - "${TAILSCALE_IP}:${AI_TRADING_PORT:-5100}:5000"
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.morning.schedule: "0 7 * * 1-5"
      ofelia.job-exec.morning.command: "python /app/run_advisor.py"
      ofelia.job-exec.evening.schedule: "0 19 * * 1-5"
      ofelia.job-exec.evening.command: "python /app/run_advisor.py"
    networks:
      - nas

  ai-trading-ofelia:
    image: mcuadros/ofelia:latest
    container_name: ai-trading-ofelia
    restart: unless-stopped
    depends_on:
      - ai-trading
    command: daemon --docker
    environment:
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - nas

networks:
  nas:
    external: true
    name: nas