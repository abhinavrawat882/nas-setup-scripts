# NAS projects stack: RabbitMQ + local Docker Registry + TellegramService
# + AI Trading + HomeSecurity.
# Shares the external "nas" network created by the core stack.
# Host ports bind to TAILSCALE_IP only (not LAN / 0.0.0.0), except:
#   - HomeSecurity dashboard (LAN, so household can trigger lockdown without Tailscale)

services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    hostname: nas
    restart: unless-stopped
    environment:
      RABBITMQ_NODENAME: rabbit@nas
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    volumes:
      - ${NAS_ROOT}/docker/rabbitmq:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    ports:
      - "${TAILSCALE_IP}:${RABBITMQ_PORT:-5672}:5672"
      - "${TAILSCALE_IP}:${RABBITMQ_MGMT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nas

  registry:
    image: registry:2
    container_name: registry
    restart: unless-stopped
    volumes:
      - ${NAS_ROOT}/docker/registry:/var/lib/registry
      - ./registry-config.yml:/etc/docker/registry/config.yml:ro
      - ${NAS_ROOT}/docker/registry-auth:/auth:ro
    ports:
      - "${TAILSCALE_IP}:${REGISTRY_PORT:-5000}:5000"
    mem_limit: 256m
    networks:
      - nas

  # Image must be pushed first from Mac (crane/docker) to this registry.
  # Pulls happen on the Docker *host*, so use Tailscale IP — not the
  # compose service name "registry" (that only resolves inside the nas network).
  tellegram:
    image: ${TAILSCALE_IP}:${REGISTRY_PORT:-5000}/tellegramservice:latest
    container_name: tellegram
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__UserName: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASS}
      RabbitMq__Exchange: alerts
      RabbitMq__Queue: telegram.alerts
      RabbitMq__RoutingKey: "alert.#"
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN}
      Telegram__ChatId: ${TELEGRAM_CHAT_ID}
      Telegram__ParseMode: HTML
    networks:
      - nas

  # AI Trading Advisor — build/push ai-trading:latest to the local registry first.
  # Dashboard: http://${TAILSCALE_IP}:5000  (Tailscale only)
  # Place config.yaml under ${NAS_ROOT}/docker/ai-trading/config.yaml
  ai-trading:
    image: ${TAILSCALE_IP}:${REGISTRY_PORT:-5000}/ai-trading:latest
    platform: linux/amd64
    container_name: ai-trading
    restart: unless-stopped
    working_dir: /app
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      HOST: "0.0.0.0"
      PORT: "5000"
      TZ: ${TZ:-Asia/Kolkata}
      LOG_LEVEL: ${AI_TRADING_LOG_LEVEL:-INFO}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ALERTS_RABBITMQ_HOST: rabbitmq
      ALERTS_RABBITMQ_USER: ${RABBITMQ_USER}
      ALERTS_RABBITMQ_PASS: ${RABBITMQ_PASS}
      ALERTS_RABBITMQ_PORT: "5672"
      ALERTS_DASHBOARD_BASE_URL: http://${TAILSCALE_IP}:${AI_TRADING_PORT:-5100}
      REPORT_AUTO_OPEN: "false"
    volumes:
      - ${NAS_ROOT}/docker/ai-trading/config.yaml:/app/config.yaml
      - ${NAS_ROOT}/docker/ai-trading/data:/app/data
    ports:
      - "${TAILSCALE_IP}:${AI_TRADING_PORT:-5100}:5000"
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.morning.schedule: "0 7 * * 1-5"
      ofelia.job-exec.morning.command: "python /app/run_advisor.py"
      ofelia.job-exec.evening.schedule: "0 19 * * 1-5"
      ofelia.job-exec.evening.command: "python /app/run_advisor.py"
    networks:
      - nas

  ai-trading-ofelia:
    image: mcuadros/ofelia:latest
    container_name: ai-trading-ofelia
    restart: unless-stopped
    depends_on:
      - ai-trading
    command: daemon --docker
    environment:
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - nas

  # HomeSecurity — images pushed from Mac (HomeSecuritySystem/scripts/build-push-nas.sh).
  # Dashboard is on LAN (like Jellyfin). API is Tailscale-only; LAN UI uses nginx /api proxy.
  postgres:
    image: postgres:16-alpine
    container_name: homesecurity-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${HOMESECURITY_POSTGRES_DB:-homesecurity}
      POSTGRES_USER: ${HOMESECURITY_POSTGRES_USER:-homesecurity}
      POSTGRES_PASSWORD: ${HOMESECURITY_POSTGRES_PASSWORD:?set HOMESECURITY_POSTGRES_PASSWORD in config.env}
      TZ: ${TZ:-UTC}
    volumes:
      - ${NAS_ROOT}/docker/homesecurity/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HOMESECURITY_POSTGRES_USER:-homesecurity} -d ${HOMESECURITY_POSTGRES_DB:-homesecurity}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - homesecurity

  redis:
    image: redis:7-alpine
    container_name: homesecurity-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - homesecurity

  api:
    image: ${TAILSCALE_IP}:${REGISTRY_PORT:-5000}/homesecurity-api:latest
    platform: linux/amd64
    container_name: homesecurity-api
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      TZ: ${TZ:-UTC}
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;Port=5432;Database=${HOMESECURITY_POSTGRES_DB:-homesecurity};Username=${HOMESECURITY_POSTGRES_USER:-homesecurity};Password=${HOMESECURITY_POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      Redis__Channel: security.events.completed
      Media__BasePath: /data/recordings
      Telegram__Enabled: ${HOMESECURITY_TELEGRAM_ENABLED:-true}
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN:-}
      Telegram__ChatId: ${TELEGRAM_CHAT_ID:-}
      PublicUrls__ApiBaseUrl: http://${TAILSCALE_IP}:${HOMESECURITY_API_PORT:-5101}
      PublicUrls__DashboardBaseUrl: http://${TAILSCALE_IP}:${HOMESECURITY_DASHBOARD_PORT:-8081}
      Retention__Enabled: ${HOMESECURITY_RETENTION_ENABLED:-true}
      Retention__Days: ${HOMESECURITY_RETENTION_DAYS:-10}
      Retention__IntervalHours: ${HOMESECURITY_RETENTION_INTERVAL_HOURS:-6}
      Cors__Origins__0: http://${TAILSCALE_IP}:${HOMESECURITY_DASHBOARD_PORT:-8081}
      Cors__Origins__1: ${HOMESECURITY_DASHBOARD_LAN_URL:-http://127.0.0.1:8081}
    volumes:
      - ${HOMESECURITY_RECORDINGS_PATH}:/data/recordings
    ports:
      - "${TAILSCALE_IP}:${HOMESECURITY_API_PORT:-5101}:8080"
    networks:
      - homesecurity

  pipeline:
    image: ${TAILSCALE_IP}:${REGISTRY_PORT:-5000}/homesecurity-pipeline:latest
    platform: linux/amd64
    container_name: homesecurity-pipeline
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_CHANNEL: security.events.completed
      RECORDINGS_DIR: /data/recordings
      FACE_DB_DIR: /data/face_db
      OBJECT_DETECTION_ENABLED: ${HOMESECURITY_OBJECT_DETECTION_ENABLED:-false}
      PERSON_TRACKING_ENABLED: ${HOMESECURITY_PERSON_TRACKING_ENABLED:-false}
      FACE_ANALYSIS_ENABLED: ${HOMESECURITY_FACE_ANALYSIS_ENABLED:-false}
      YOLO_DEVICE: ${HOMESECURITY_YOLO_DEVICE:-cpu}
    volumes:
      - ${HOMESECURITY_RECORDINGS_PATH}:/data/recordings
      - ${NAS_ROOT}/docker/homesecurity/face_db:/data/face_db
      - ${NAS_ROOT}/docker/homesecurity/cameras.yaml:/app/cameras.yaml:ro
    networks:
      - homesecurity

  dashboard:
    image: ${TAILSCALE_IP}:${REGISTRY_PORT:-5000}/homesecurity-dashboard:latest
    platform: linux/amd64
    container_name: homesecurity-dashboard
    restart: unless-stopped
    depends_on:
      - api
    ports:
      # LAN + Tailscale (UFW bypass) so household can open the UI without Tailscale.
      - "${HOMESECURITY_DASHBOARD_PORT:-8081}:80"
    networks:
      - homesecurity

networks:
  nas:
    external: true
    name: nas
  homesecurity:
    name: homesecurity
    driver: bridge