# NAS projects stack: RabbitMQ + local Docker Registry + TellegramService
# Shares the external "nas" network created by the core stack.
# Host ports bind to TAILSCALE_IP only (not LAN / 0.0.0.0).

services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    hostname: nas
    restart: unless-stopped
    environment:
      RABBITMQ_NODENAME: rabbit@nas
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    volumes:
      - ${NAS_ROOT}/docker/rabbitmq:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    ports:
      - "${TAILSCALE_IP}:${RABBITMQ_PORT:-5672}:5672"
      - "${TAILSCALE_IP}:${RABBITMQ_MGMT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nas

  registry:
    image: registry:2
    container_name: registry
    restart: unless-stopped
    volumes:
      - ${NAS_ROOT}/docker/registry:/var/lib/registry
      - ./registry-config.yml:/etc/docker/registry/config.yml:ro
      - ${NAS_ROOT}/docker/registry-auth:/auth:ro
    ports:
      - "${TAILSCALE_IP}:${REGISTRY_PORT:-5000}:5000"
    mem_limit: 256m
    networks:
      - nas

  # Image must be pushed first: <TAILSCALE_IP>:5000/tellegramservice:latest
  # On the nas network, pull via registry:5000 (same registry container).
  tellegram:
    image: registry:5000/tellegramservice:latest
    container_name: tellegram
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__UserName: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASS}
      RabbitMq__Exchange: alerts
      RabbitMq__Queue: telegram.alerts
      RabbitMq__RoutingKey: "alert.#"
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN}
      Telegram__ChatId: ${TELEGRAM_CHAT_ID}
      Telegram__ParseMode: HTML
    networks:
      - nas

networks:
  nas:
    external: true
    name: nas
