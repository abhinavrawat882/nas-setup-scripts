# cameras.yaml
# Camera definitions for the HomeSecurity ingestion pipeline.
#
# Copied to ${NAS_ROOT}/docker/homesecurity/cameras.yaml on first setup.
# Edit RTSP URLs so they are reachable from the NAS (Tailscale MagicDNS or LAN).
#
# RTSP URL format:  rtsp://<hostname-or-ip>:<port>/<path>
# MediaMTX default: rtsp://<pi-hostname>:8554/cam
#
# USB webcam on the NAS (see HOMESECURITY_USB_CAMERA in config.env):
#   - name: Arnos_Room
#     source: /dev/video0

cameras:
  - name: Hall_DoorFacing
    rtsp_url: rtsp://arnohomecam-hall:8554/cam

  - name: Hall_KitchenFacing
    rtsp_url: rtsp://arnohomecam-room:8554/cam
