# NAS core stack: Portainer + Jellyfin + Vaultwarden
# Driven by compose/.env (generated from repo-root config.env by deploy script).
# Project name comes from COMPOSE_PROJECT_NAME in .env.

services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${NAS_ROOT}/docker/portainer:/data
    ports:
      # Bind to Tailscale only — avoids Docker publishing on 0.0.0.0 (UFW bypass).
      - "${TAILSCALE_IP}:${PORTAINER_PORT:-9000}:9000"
      - "${TAILSCALE_IP}:9443:9443"
    networks:
      - nas

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-100}
      - TZ=${TZ:-UTC}
    volumes:
      - ${NAS_ROOT}/docker/jellyfin/config:/config
      - ${MEDIA_PATH}/movies:/data/movies:ro
      - ${MEDIA_PATH}/tv:/data/tv:ro
      - ${MEDIA_PATH}/music:/data/music:ro
    ports:
      # Jellyfin stays on all interfaces (LAN) for local discovery — not Tailscale-only.
      - "${JELLYFIN_PORT:-8096}:8096"
      - "7359:7359/udp"
    networks:
      - nas

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
      - SIGNUPS_ALLOWED=${VAULTWARDEN_SIGNUPS_ALLOWED:-true}
      - WEBSOCKET_ENABLED=true
    volumes:
      - ${NAS_ROOT}/docker/vaultwarden:/data
    ports:
      - "${TAILSCALE_IP}:${VAULTWARDEN_PORT:-8080}:80"
    networks:
      - nas

networks:
  nas:
    name: nas
    driver: bridge
